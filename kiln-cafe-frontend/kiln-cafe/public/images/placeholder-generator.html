<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Ethiopian Placeholders</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .placeholder { 
            width: 400px; 
            height: 300px; 
            background: linear-gradient(135deg, #2d5016 0%, #4a7729 100%);
            margin: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .placeholder::before {
            content: '☕';
            position: absolute;
            font-size: 120px;
            opacity: 0.1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .text {
            z-index: 1;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        button {
            background: #2d5016;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #4a7729; }
    </style>
</head>
<body>
    <h1>Ethiopian Café Placeholder Generator</h1>
    <p>Click the button below to download placeholder images for your café.</p>
    <p><strong>Note:</strong> Replace these with real photos from Abol Garden Cafe!</p>
    
    <button onclick="generateAllPlaceholders()">Generate All Placeholders</button>
    
    <div id="placeholders"></div>

    <script>
        const placeholderNames = [
            'buna-ceremony',
            'yirgacheffe', 
            'sidamo-coffee',
            'harar-coffee',
            'macchiato',
            'spris',
            'injera-combo',
            'tibs',
            'kitfo',
            'fasting-platter',
            'ambasha',
            'dabo',
            'fresh-juice',
            'hero-background',
            'cafe-exterior',
            'garden-seating'
        ];

        function generateAllPlaceholders() {
            alert('Placeholders concept ready! For actual images, please add real photos from your café to the /public/images/ folder.');
        }
    </script>
</body>
</html>
